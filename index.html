<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>TEST MY HOLES</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="page-title">
      <p class="eyebrow">IGNITE · GIT + HTTPS TEST</p>
      <h1 id="page-title">TEST MY HOLES</h1>
      <p class="summary">This page is served from a Git repository through a stable GitHub Pages URL.</p>

      <dl class="status-grid">
        <div>
          <dt>Deployment</dt>
          <dd><span class="indicator" aria-hidden="true"></span> Live</dd>
        </div>
        <div>
          <dt>Source</dt>
          <dd>GitHub repository</dd>
        </div>
        <div>
          <dt>Last viewed</dt>
          <dd id="viewed-at">Loading…</dd>
        </div>
      </dl>

      <p class="instruction">Merge a change into <code>main</code>, wait for GitHub Pages to deploy, and refresh this URL to see the update.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
